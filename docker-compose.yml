services:
  eventbro:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL}
    restart: unless-stopped
    ports:
      - '3030:3030'
      - '3031:3031'
    env_file:
      - .env
    environment:
      # Override .env: ports are fixed by this setup, DB is the postgres service below,
      # and the app reaches the WS server over loopback.
      PORT: 3030
      NOTIFICATION_WS_PORT: 3031
      DATABASE_URL: postgres://eventbro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/eventbro
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventbro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eventbro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventbro -d eventbro']
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only the app container reaches the DB.

volumes:
  pgdata:
  media:
